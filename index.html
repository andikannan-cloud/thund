<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CipherStream</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d111c'/%3E%3Cpath d='M20 28v-5a12 12 0 0 1 24 0v5' fill='none' stroke='%2338bdf8' stroke-width='4.5' stroke-linecap='round'/%3E%3Crect x='14' y='28' width='36' height='24' rx='7' fill='%231e293b' stroke='%2338bdf8' stroke-width='3'/%3E%3Cpolygon points='29,35 29,45 38,40' fill='%2338bdf8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/styles.css?v=3" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <!-- ================= PASSKEY LOCK GATE ================= -->
  <main id="lockScreen" class="lock-screen">
    <section id="lockCard" class="lock-card" aria-labelledby="lockHeading">
      <div class="lock-emblem" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42" fill="none">
          <path d="M15 21v-5a9 9 0 0 1 18 0v5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <rect x="10" y="21" width="28" height="20" rx="6" fill="rgba(56,189,248,0.12)" stroke="currentColor" stroke-width="2.6"/>
          <polygon points="21.5,27 21.5,35 28.5,31" fill="currentColor"/>
        </svg>
      </div>

      <h1 id="lockHeading" class="lock-title">CipherStream</h1>

      <form id="lockForm" class="lock-form" autocomplete="off">
        <div class="passkey-field-wrap">
          <input
            id="passkeyInput"
            type="password"
            class="passkey-input"
            placeholder="Passkey"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Passkey"
          />
          <button
            type="button"
            id="togglePasskeyVis"
            class="passkey-eye-btn"
            title="Show or hide passkey"
            aria-label="Show or hide passkey"
          >
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="lock-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberSessionChk" checked />
            <span>Remember session</span>
          </label>
          <button type="button" id="keypadToggleBtn" class="link-btn">Keypad</button>
        </div>

        <div id="quickKeypad" class="quick-keypad" hidden>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="clear" class="key-fn">CLR</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="back" class="key-fn">⌫</button>
        </div>

        <p id="lockError" class="lock-error" role="alert" hidden></p>

        <button type="submit" id="unlockBtn" class="unlock-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
          </svg>
          <span id="unlockBtnText">Unlock</span>
        </button>
      </form>
    </section>
  </main>

  <!-- ================= UNLOCKED APPLICATION SHELL ================= -->
  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-cluster">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
              <rect x="3" y="5" width="26" height="22" rx="6" fill="rgba(56,189,248,0.16)" stroke="currentColor" stroke-width="2.2"/>
              <polygon points="13,11 13,21 21.5,16" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <div class="brand-name">CipherStream</div>
            <div id="vaultStatsPill" class="brand-stats"></div>
          </div>
        </div>

        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            id="searchInput"
            type="search"
            class="search-input"
            placeholder="Search videos..."
            aria-label="Search videos"
          />
          <button type="button" id="clearSearchBtn" class="clear-search-btn" hidden aria-label="Clear search">✕</button>
        </div>

        <div class="topbar-actions">
          <button type="button" id="syncDriveBtn" class="ghost-btn" hidden title="Refresh videos">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-15.5-6.36L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.36L21 16"/><path d="M21 21v-5h-5"/>
            </svg>
            <span class="hide-xs">Refresh</span>
          </button>
          <button type="button" id="lockVaultBtn" class="lock-action-btn" title="Lock">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Lock</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ================= GALLERY VIEW ================= -->
    <main id="gallerySection" class="container gallery-section">
      <div class="toolbar-row">
        <div class="filter-tabs" role="tablist" aria-label="Filter library">
          <button type="button" class="filter-tab is-active" data-filter="all">
            All <span id="countAll" class="tab-count">0</span>
          </button>
          <button type="button" class="filter-tab" data-filter="groups">
            Series <span id="countGroups" class="tab-count">0</span>
          </button>
          <button type="button" class="filter-tab" data-filter="singles">
            Singles <span id="countSingles" class="tab-count">0</span>
          </button>
        </div>
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>

      <div id="emptyState" class="empty-state" hidden>
        <p class="empty-title">No videos found</p>
        <p class="empty-sub">Try clearing your search or switching filters.</p>
      </div>
    </main>

    <!-- ================= WATCH / THEATER VIEW ================= -->
    <section id="watchSection" class="container watch-section" hidden>
      <div class="watch-topbar">
        <button type="button" id="backToGalleryBtn" class="back-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>Back</span>
        </button>

        <div class="watch-heading-box">
          <h2 id="watchTitle" class="watch-title">—</h2>
          <p id="watchSubtitle" class="watch-subtitle">—</p>
        </div>

        <!-- Shown automatically whenever a multi-part group (_00, _01, ...) is opened -->
        <div id="watchModeToggle" class="mode-switch" role="group" aria-label="Viewing mode" hidden>
          <button type="button" id="modePlaylistBtn" class="mode-btn is-active">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="4" cy="12" r="1.3" fill="currentColor"/><circle cx="4" cy="18" r="1.3" fill="currentColor"/>
            </svg>
            <span>Playlist</span>
          </button>
          <button type="button" id="modeTogetherBtn" class="mode-btn">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1">
              <rect x="3" y="4" width="8" height="16" rx="1.8"/><rect x="13" y="4" width="8" height="16" rx="1.8"/>
            </svg>
            <span>See All Together</span>
          </button>
        </div>
      </div>

      <!-- MODE 1: Playlist / Single Theater Layout -->
      <div id="playlistLayout" class="playlist-layout">
        <div class="theater-main-col">
          <div id="mainPlayerMount" class="main-player-mount"></div>
          <div id="activeMetaBar" class="active-meta-bar"></div>
        </div>

        <aside id="playlistSidebar" class="playlist-sidebar" aria-label="Parts">
          <div class="sidebar-head">
            <div>
              <h3 class="sidebar-title">Parts</h3>
              <span id="partsCountBadge" class="sidebar-sub">2 Parts</span>
            </div>
            <button type="button" id="sidebarLoopBtn" class="sidebar-loop-pill is-active">
              Loop All: ON
            </button>
          </div>
          <div id="partsList" class="parts-list"></div>
        </aside>
      </div>

      <!-- MODE 2: Together View (Watch _00, _01, ... side-by-side simultaneously) -->
      <div id="togetherLayout" class="together-layout" hidden>
        <div class="sync-master-bar">
          <div class="sync-label">
            <span class="mp4-live-dot"></span>
            <strong>Together View</strong>
          </div>
          <div class="sync-controls">
            <button type="button" id="syncPlayAllBtn" class="sync-btn sync-btn-primary">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
              <span>Play All</span>
            </button>
            <button type="button" id="syncPauseAllBtn" class="sync-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>
              <span>Pause All</span>
            </button>
            <button type="button" id="syncRestartBtn" class="sync-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Sync 0:00</span>
            </button>
            <button type="button" id="syncLoopAllBtn" class="sync-btn is-active">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              <span>Loop All: <span class="sync-loop-state">ON</span></span>
            </button>
            <button type="button" id="syncUnmuteAllBtn" class="sync-btn">Audio: Part 1 Only</button>
          </div>
        </div>

        <div id="togetherGrid" class="together-grid"></div>
      </div>

      <!-- More Videos -->
      <div class="up-next-section">
        <h3 class="section-label">More Videos</h3>
        <div id="upNextGrid" class="gallery-grid"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./js/app.js?v=3"></script>
</body>
</html>
